<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ค้นหาห้องสอบปลายภาค</title>
  <!-- ฟอนต์ไม่มีหัว จาก Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500&display=swap" rel="stylesheet">
  <style>
    /* เลือดหมู–ขาว, sans-serif, ทุกอย่างกึ่งกลาง */
    body {
      background-color: #ffffff;
      color: #800020;
      font-family: 'Kanit', sans-serif;
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1, h2 {
      text-align: center;
      color: #800020;
      margin: 0.5rem 0 1rem;
    }
    .card {
      background-color: #ffffff;
      border: 2px solid #800020;
      border-radius: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 1.5rem;
      margin: 1rem 0;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    label {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 300px;
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    label span {
      margin-left: 0.5rem;
      text-align: left;
      flex: 1;
    }
    input[type="text"], button, #searchInput {
      width: 100%;
      max-width: 300px;
      padding: 0.75rem;
      margin-bottom: 1rem;
      text-align: center;
      border-radius: 0.5rem;
      border: 1px solid #ddd;
      font-size: 1rem;
      font-family: 'Kanit', sans-serif;
    }
    #searchInput {
      margin-bottom: 0.75rem;
    }
    button {
      background-color: #800020;
      color: #ffffff;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #a12238;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      border: 1px solid #800020;
      padding: 0.5rem;
      text-align: center;
      font-size: 0.95rem;
    }
    th {
      background-color: #f8f0f2;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <h1>ระบบตรวจสอบข้อมูลสอบปลายภาค</h1>

  <!-- ฟอร์มกรอกรหัสนิสิต -->
  <div class="card">
    <label for="studentId">กรอกรหัสนิสิต:</label>
    <input type="text" id="studentId" placeholder="เช่น 6630012345">
    <button id="btnSearch">ตรวจสอบ</button>

    <input type="text" id="searchInput" placeholder="ค้นหารายวิชา…">
    <form id="subjectForm"></form>
    <button id="btnShow">แสดงข้อมูลสอบ</button>

    function inRange(id, start, end) {
      return id >= start && id <= end;
    }

    function searchSubjects() {
      const studentId = document.getElementById("studentId").value.trim();
      if (!studentId) {
        alert("กรุณากรอกรหัสนิสิตก่อน");
        return;
      }
      const form = document.getElementById("subjectForm");
      form.innerHTML = "";
      const matched = data.filter(sub =>
        sub.students.some(s => inRange(studentId, s.range[0], s.range[1]))
      );
      if (!matched.length) {
        alert("ไม่พบรายวิชาที่เกี่ยวข้องกับรหัสนิสิตนี้");
        return;
      }
      matched.forEach(sub => {
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.name = "subject";
        checkbox.value = sub.subject_code;

        const label = document.createElement("label");
        const text = document.createElement("span");
        text.textContent = `${sub.subject_code} – ${sub.subject_name}`;

        label.appendChild(checkbox);
        label.appendChild(text);
        form.appendChild(label);
      });

      document.getElementById("searchInput").value = "";
      document.getElementById("searchInput").addEventListener("input", filterSubjects);
      document.getElementById("subjectList").classList.remove("hidden");
    }

    function filterSubjects() {
      const filter = document.getElementById("searchInput").value.trim().toLowerCase();
      document.querySelectorAll("#subjectForm label").forEach(label => {
        const txt = label.textContent.toLowerCase();
        label.style.display = txt.includes(filter) ? "flex" : "none";
      });
    }

    function showExamDetails() {
      const studentId = document.getElementById("studentId").value.trim();
      const checked = Array.from(document.querySelectorAll("input[name='subject']:checked"))
                           .map(cb => cb.value);
      const tbody = document.getElementById("examTableBody");
      tbody.innerHTML = "";

      checked.forEach(code => {
        const sub = data.find(s => s.subject_code === code);
        const info = sub.students.find(s => inRange(studentId, s.range[0], s.range[1])) || {};
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${sub.subject_code}</td>
          <td>${sub.subject_name}</td>
          <td>${sub.exam_date}</td>
          <td>${sub.exam_time}</td>
          <td>${info.building || ""}</td>
          <td>${info.room || ""}</td>
        `;
        tbody.appendChild(row);
      });

      document.getElementById("result").classList.remove("hidden");
    }

    document.getElementById("btnSearch").addEventListener("click", searchSubjects);
    document.getElementById("btnShow").addEventListener("click", showExamDetails);
